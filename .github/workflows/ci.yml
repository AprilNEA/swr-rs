name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        # swr-gpui builds on the macOS job (gpui needs platform toolchains).
        run: cargo clippy --workspace --exclude swr-gpui --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude swr-gpui
      - name: Check (native)
        run: cargo check --workspace --exclude swr-gpui
      - name: Check (wasm32)
        run: cargo check -p swr-core -p swr-runtime-web -p swr --target wasm32-unknown-unknown
      - name: Clippy (wasm32)
        # Lib targets only for swr-core and swr: their dev-dependencies
        # (proptest, tokio) are native-only.
        run: |
          cargo clippy -p swr-core -p swr --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p swr-runtime-web --target wasm32-unknown-unknown --all-targets -- -D warnings

  wasm-test:
    name: wasm smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run wasm tests (headless Chrome)
        run: wasm-pack test --headless --chrome crates/swr-runtime-web

  gpui:
    name: swr-gpui (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p swr-gpui --all-targets -- -D warnings
      - name: Test
        run: cargo test -p swr-gpui

[package]
name = "swr"
description = "Stale-while-revalidate async cache for Rust: the swr-core API plus the default runtime for each platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
swr-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
swr-runtime-tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
swr-runtime-web.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "test-util"] }

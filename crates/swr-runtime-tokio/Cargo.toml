[package]
name = "swr-runtime-tokio"
description = "Tokio implementation of the swr-core Runtime trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
swr-core.workspace = true
tokio = { version = "1.53.1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "test-util"] }

[workspace]
resolver = "3"
members = [
    "crates/swr",
    "crates/swr-core",
    "crates/swr-gpui",
    "crates/swr-reqwest",
    "crates/swr-runtime-tokio",
    "crates/swr-runtime-web",
    "crates/swr-ureq",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AprilNEA/swr-rs"
readme = "README.md"
keywords = ["swr", "cache", "async", "query", "revalidate"]
categories = ["caching", "asynchronous"]

[workspace.dependencies]
swr-core = { path = "crates/swr-core", version = "0.1.0" }
swr-gpui = { path = "crates/swr-gpui", version = "0.1.1" }
swr-reqwest = { path = "crates/swr-reqwest", version = "0.1.0" }
swr-runtime-tokio = { path = "crates/swr-runtime-tokio", version = "0.1.0" }
swr-runtime-web = { path = "crates/swr-runtime-web", version = "0.1.0" }
swr-ureq = { path = "crates/swr-ureq", version = "0.1.0" }
